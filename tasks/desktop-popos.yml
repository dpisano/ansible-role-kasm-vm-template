---
# Pop!_OS desktop. The GNOME-based release (22.04) is reached over RDP with
# xrdp; COSMIC (24.04+) is Wayland-only, so it gets wayvnc, a VNC server that
# Kasm connects to as a VNC server. kasm_popos_remote picks one (auto looks for
# cosmic-session).
- name: Look for COSMIC
  ansible.builtin.stat:
    path: /usr/bin/cosmic-session
  register: kasm_popos_cosmic

- name: Pick the remote desktop
  ansible.builtin.set_fact:
    kasm_popos_remote_mode: >-
      {{ kasm_popos_remote if kasm_popos_remote != 'auto'
         else ('wayvnc' if kasm_popos_cosmic.stat.exists else 'xrdp') }}

- name: Set up xrdp
  ansible.builtin.include_tasks: desktop-popos-xrdp.yml
  when: kasm_popos_remote_mode == 'xrdp'

- name: Set up wayvnc
  ansible.builtin.include_tasks: desktop-popos-wayvnc.yml
  when: kasm_popos_remote_mode == 'wayvnc'

# Proxmox's cloud-init drive is a NoCloud datasource. Pop!_OS uses
# NetworkManager and takes DHCP, so by default cloud-init leaves networking
# alone; set kasm_popos_cloudinit_network to let it apply a clone's ipconfig.
- name: Configure cloud-init
  ansible.builtin.copy:
    content: |
      datasource_list: [NoCloud, None]
      {% if not kasm_popos_cloudinit_network | bool %}
      network: {config: disabled}
      {% endif %}
    dest: /etc/cloud/cloud.cfg.d/99-kasm.cfg
    mode: "0644"
