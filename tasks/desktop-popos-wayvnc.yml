---
# wayvnc for COSMIC. wayvnc needs the compositor to offer screen capture and
# input injection; whether cosmic-comp does is not confirmed, so this is best
# effort. The session must log in by itself (turn on automatic login in
# COSMIC's settings during the install), and wayvnc is started with it through
# an XDG autostart entry.
- name: Check the wayvnc settings
  ansible.builtin.assert:
    that: kasm_popos_vnc_password | length > 0
    fail_msg: "os: popos with wayvnc needs kasm_popos_vnc_password"
    quiet: true

- name: Install wayvnc
  ansible.builtin.apt:
    name: [wayvnc, openssl]
    state: present
  environment:
    DEBIAN_FRONTEND: noninteractive

- name: Create wayvnc's config and autostart directories
  ansible.builtin.file:
    path: "/home/{{ kasm_os.user }}/{{ item }}"
    state: directory
    owner: "{{ kasm_os.user }}"
    group: "{{ kasm_os.user }}"
    mode: "0700"
  loop: [.config/wayvnc, .config/autostart]

- name: Generate wayvnc's TLS certificate
  ansible.builtin.command: >-
    openssl req -x509 -newkey rsa:4096 -sha256 -days 3650 -nodes
    -keyout key.pem -out cert.pem -subj /CN={{ kasm_vm.name }}
  args:
    chdir: "/home/{{ kasm_os.user }}/.config/wayvnc"
    creates: "/home/{{ kasm_os.user }}/.config/wayvnc/cert.pem"
  become: true
  become_user: "{{ kasm_os.user }}"

- name: Configure wayvnc
  ansible.builtin.copy:
    content: |
      address=0.0.0.0
      port={{ kasm_popos_vnc_port }}
      enable_auth=true
      username={{ kasm_popos_vnc_user }}
      password={{ kasm_popos_vnc_password }}
      private_key_file=/home/{{ kasm_os.user }}/.config/wayvnc/key.pem
      certificate_file=/home/{{ kasm_os.user }}/.config/wayvnc/cert.pem
    dest: "/home/{{ kasm_os.user }}/.config/wayvnc/config"
    owner: "{{ kasm_os.user }}"
    group: "{{ kasm_os.user }}"
    mode: "0600"
  no_log: "{{ kasm_template_no_log }}"

- name: Start wayvnc with the session
  ansible.builtin.copy:
    content: |
      [Desktop Entry]
      Type=Application
      Name=wayvnc (Kasm)
      Exec=/usr/bin/wayvnc
      X-GNOME-Autostart-enabled=true
    dest: "/home/{{ kasm_os.user }}/.config/autostart/wayvnc.desktop"
    owner: "{{ kasm_os.user }}"
    group: "{{ kasm_os.user }}"
    mode: "0644"
