---
# Runs inside the build VM (group kasm_build).
# A VM provisioned by an earlier run (tag kasm-provisioned) only needs finalizing.
- name: Skip a VM that is already provisioned
  ansible.builtin.meta: end_host
  when: kasm_provisioned | default(false) | bool

# An Omarchy VM answers on port 22 from the live installer too (the ISO is built
# from Arch's releng profile, which runs sshd), so the login as the new user is
# what shows the install is done. That takes a while: wait as long as the build
# phase allows for the install.
- name: Wait for SSH
  vars:
    kasm_ssh_timeout: >-
      {{ kasm_omarchy_install_retries | int * kasm_omarchy_install_delay | int
         if kasm_os.method | default('cloud-image') == 'iso' else 300 }}
  block:
    # Without sudo: the check must only prove the login works. Omarchy asks for
    # a sudo password, and a check that needed one would retry silently until
    # the timeout. ansible_become is a connection variable, which wins over a
    # task's become keyword, so it is switched off as a variable.
    - name: Wait for a login as the build user
      ansible.builtin.wait_for_connection:
        timeout: "{{ kasm_ssh_timeout }}"
      vars:
        ansible_become: false
  rescue:
    - name: Fail with what to check
      ansible.builtin.fail:
        msg: >-
          No SSH login as {{ kasm_os.user }} on {{ kasm_vm.name }} after {{ kasm_ssh_timeout }} seconds.
          {{ 'The installer may still be running, may not have loaded the cidata drive (it would then show its
          interactive wizard), or the VM may have a new address after rebooting (set build_ip on the template). Look at the VM console in Proxmox.'
          if kasm_os.method | default('cloud-image') == 'iso'
          else 'Check the VM console in Proxmox and /var/log/cloud-init-output.log.' }}

# Omarchy's installer leaves the user without passwordless sudo, so the login
# password is given to sudo as the become password.
- name: Use the login password for sudo
  ansible.builtin.set_fact:
    ansible_become_password: "{{ kasm_omarchy_password }}"
  no_log: true
  when:
    - kasm_os.method | default('cloud-image') == 'iso'
    - kasm_omarchy_password | length > 0

- name: Check sudo works
  block:
    - name: Run a command with sudo
      ansible.builtin.command: "true"
      changed_when: false
  rescue:
    - name: Fail with how to fix sudo
      ansible.builtin.fail:
        msg: >-
          sudo does not work for {{ kasm_os.user }} on {{ kasm_vm.name }}: it needs a password, or the
          one given is wrong. Set kasm_omarchy_password to the plaintext of the password behind
          kasm_omarchy_password_hash so the role can give it to sudo.

# cloud-init status --wait has no timeout of its own, so a first-boot step that
# hangs (a package install, no network) would stall the run for good. Exit 2
# means it finished with recoverable errors; the checks below catch what matters.
- name: Wait for cloud-init to finish
  ansible.builtin.command: timeout {{ kasm_template_cloud_init_timeout }} cloud-init status --wait
  register: kasm_cloud_init
  changed_when: false
  failed_when: false
  when: kasm_os.method | default('cloud-image') == 'cloud-image'

- name: Show what cloud-init is doing
  ansible.builtin.shell: |
    cloud-init status --long
    echo "--- /var/log/cloud-init-output.log (last 40 lines)"
    tail -n 40 /var/log/cloud-init-output.log
  register: kasm_cloud_init_log
  changed_when: false
  failed_when: false
  when:
    - kasm_cloud_init is not skipped
    - kasm_cloud_init.rc not in [0, 2]

- name: Fail if cloud-init did not finish
  vars:
    kasm_cloud_init_what: >-
      {{ 'did not finish within ' ~ kasm_template_cloud_init_timeout ~ ' seconds'
         if kasm_cloud_init.rc == 124 else 'failed' }}
  ansible.builtin.fail:
    msg: |-
      cloud-init on {{ kasm_vm.name }} {{ kasm_cloud_init_what }}.
      {{ kasm_cloud_init_log.stdout | default('') }}
  when:
    - kasm_cloud_init is not skipped
    - kasm_cloud_init.rc not in [0, 2]

- name: Gather facts
  ansible.builtin.setup:

- name: Omarchy desktop (wayvnc)
  ansible.builtin.include_tasks: provision-omarchy.yml
  when: kasm_os.method | default('cloud-image') == 'iso'

- name: Provision the cloud-image or Pop!_OS system
  when: kasm_os.method | default('cloud-image') in ['cloud-image', 'manual-iso']
  block:
    - name: Check the OS has tasks for this kind
      ansible.builtin.assert:
        that: not (kasm_vm.kind == 'desktop' and kasm_os.family == 'arch')
        fail_msg: "kind: desktop is only supported on Debian and Ubuntu (xrdp is not in Arch's repositories)"
        quiet: true

    - name: Base packages and upgrades
      ansible.builtin.include_tasks: "base-{{ kasm_os.family }}.yml"

    - name: Docker for agent templates
      ansible.builtin.include_tasks: "docker-{{ kasm_os.family }}.yml"
      when: kasm_vm.kind == 'agent'

    - name: Pre-pull Docker images
      ansible.builtin.command: docker pull {{ item }}
      loop: "{{ kasm_template_prepull_images }}"
      changed_when: true
      when: kasm_vm.kind == 'agent'

    - name: Desktop and RDP for desktop templates
      ansible.builtin.include_tasks:
        file: "desktop-{{ 'popos' if kasm_os.method | default('cloud-image') == 'manual-iso' else 'debian' }}.yml"
      when: kasm_vm.kind == 'desktop'

    - name: Clean the guest so clones start fresh
      ansible.builtin.include_tasks: "clean-{{ kasm_os.family }}.yml"

    - name: Reset cloud-init, machine-id and SSH host keys
      ansible.builtin.shell: |
        cloud-init clean --logs
        truncate -s 0 /etc/machine-id
        rm -f /var/lib/dbus/machine-id /etc/ssh/ssh_host_*
        rm -f /root/.bash_history /home/*/.bash_history
      changed_when: true

# The marker for finalize and for a later run: this VM is provisioned and only
# needs to be shut down and converted. Set on the Proxmox node (the VM itself
# can't), and last, so it only exists when everything above succeeded.
- name: Mark the VM as provisioned
  ansible.builtin.command:
    argv: [qm, set, "{{ kasm_vm.vmid }}", --tags, "kasm;{{ kasm_template_provisioned_tag }}"]
  delegate_to: "{{ kasm_pve_node }}"
  vars:
    ansible_become: false
  changed_when: true
