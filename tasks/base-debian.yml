---
- name: Upgrade packages
  ansible.builtin.apt:
    update_cache: true
    upgrade: dist
  environment:
    DEBIAN_FRONTEND: noninteractive

# wget and psmisc (fuser) are used by Kasm's agent startup script; Debian's
# cloud image has neither.
- name: Install base packages
  ansible.builtin.apt:
    name: [qemu-guest-agent, cloud-init, curl, ca-certificates, gnupg, sudo, htop, vim, wget, psmisc]
    state: present

- name: Enable the guest agent
  ansible.builtin.systemd:
    name: qemu-guest-agent
    enabled: true
