---
- name: Upgrade packages
  community.general.pacman:
    update_cache: true
    upgrade: true

- name: Install base packages
  community.general.pacman:
    name: [qemu-guest-agent, cloud-init, curl, ca-certificates, gnupg, sudo, htop, vim]
    state: present

- name: Enable the guest agent
  ansible.builtin.systemd:
    name: qemu-guest-agent
    enabled: true
