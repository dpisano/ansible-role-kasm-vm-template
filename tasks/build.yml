---
- name: Check the OS of every VM
  ansible.builtin.assert:
    that:
      - item.os in kasm_template_os
      - (kasm_template_defaults | combine(item)).kind in ['agent', 'desktop']
    fail_msg: "{{ item.name | default('?') }}: os must be one of {{ kasm_template_os.keys() | list }} and kind agent or desktop"
    quiet: true
  loop: "{{ kasm_builds }}"
  loop_control:
    label: "{{ item.name }}"

- name: Check templates are agents and servers do not clash with them
  ansible.builtin.assert:
    that:
      - (kasm_templates | map(attribute='kind', default='agent') | unique | list) in [['agent'], []]
      - (kasm_builds | map(attribute='vmid') | list | length) == (kasm_builds | map(attribute='vmid') | unique | list | length)
      - (kasm_builds | map(attribute='name') | list | length) == (kasm_builds | map(attribute='name') | unique | list | length)
    fail_msg: >-
      kasm_templates only builds kind: agent templates (Linux desktops are
      kasm_servers, which are not templates), and every name and vmid must be unique.
    quiet: true

- name: Check the RDP login of the cloud-image servers
  ansible.builtin.assert:
    that: kasm_server_login_password | length > 0
    fail_msg: >-
      kasm_servers with a cloud-image OS need kasm_server_login_password, the password
      the role gives the RDP login (kasm_server_login_user) that Kasm connects as.
    quiet: true
  when: kasm_servers | rejectattr('os', 'in', ['omarchy', 'popos']) | list | length > 0

- name: Enable snippets on the snippets storage
  block:
    - name: Check the storage for snippets
      ansible.builtin.command: pvesm status --storage {{ kasm_template_snippets_storage }} --content snippets
      register: kasm_snippets_check
      changed_when: false
      failed_when: false

    - name: Add the snippets content type
      ansible.builtin.shell: |
        set -o pipefail
        pvesm set {{ kasm_template_snippets_storage }} --content "$(pvesm config {{ kasm_template_snippets_storage }} | awk '/^content/{print $2}'),snippets"
      args:
        executable: /bin/bash
      changed_when: true
      when: kasm_snippets_check.stdout_lines | length < 2

- name: Create the image and snippet directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ kasm_template_image_dir }}"
    - "{{ kasm_template_snippets_dir }}"

- name: Download the cloud image for each OS in use
  ansible.builtin.get_url:
    url: "{{ item.url }}"
    dest: "{{ kasm_template_image_dir }}/{{ item.file }}"
    mode: "0644"
  loop: "{{ kasm_builds | map(attribute='os') | unique | map('extract', kasm_template_os) | selectattr('file', 'defined') | list }}"
  loop_control:
    label: "{{ item.file }}"

- name: Prepare for Omarchy
  ansible.builtin.include_tasks: omarchy-host.yml
  when: kasm_builds | selectattr('os', 'eq', 'omarchy') | list | length > 0

- name: Build each VM
  ansible.builtin.include_tasks: vm.yml
  loop: "{{ kasm_builds }}"
  loop_control:
    loop_var: kasm_item
    label: "{{ kasm_item.name }}"
