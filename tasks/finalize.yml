---
# Runs on the Proxmox node: shuts down and converts each provisioned VM. Every
# step looks at the VM's config first, so it can be run again after a failure
# partway through.
# qm set --sshkeys takes the path of a file holding the key(s), not the key.
- name: Write the SSH key to a file for qm
  ansible.builtin.copy:
    content: "{{ kasm_template_ssh_public_key }}\n"
    dest: "{{ kasm_template_sshkeys_file }}"
    mode: "0600"

- name: Finish each VM
  ansible.builtin.include_tasks: finalize-vm.yml
  loop: "{{ groups.get('kasm_build', []) | select('in', hostvars) | list }}"
  loop_control:
    loop_var: kasm_fin
    label: "{{ kasm_fin }}"
  when: hostvars[kasm_fin].kasm_pve_node == inventory_hostname

- name: Remove the SSH key file
  ansible.builtin.file:
    path: "{{ kasm_template_sshkeys_file }}"
    state: absent
